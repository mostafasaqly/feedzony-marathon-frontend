@if (isOpen) {
  <div class="dropdown">
    <div class="dropdown-header">
      <span class="dropdown-title">Notifications</span>
      @if (hasUnread) {
        <button class="mark-all-btn" (click)="markAllAsRead()">Mark all as read</button>
      }
    </div>

    <div class="dropdown-body">
      @if (loading) {
        @for (s of skeletons; track s) {
          <div class="skel-item">
            <div class="skel-dot"></div>
            <div class="skel-lines">
              <div class="skel-line title"></div>
              <div class="skel-line message"></div>
            </div>
          </div>
        }
      } @else if (notifications.length === 0) {
        <div class="empty">No notifications yet</div>
      } @else {
        @for (n of notifications; track n.id) {
          <app-notification-card
            [notification]="n"
            [compact]="true"
            (clicked)="onCardClicked($event)">
          </app-notification-card>
        }
      }
    </div>

    <div class="dropdown-footer">
      <a routerLink="/dashboard/notifications" (click)="closed.emit()" class="view-all-link">
        View all notifications →
      </a>
    </div>
  </div>
}
