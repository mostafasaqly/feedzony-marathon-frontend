@if (isOpen) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close" (click)="onClose()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="limit-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h2 class="modal-title">{{ title }}</h2>
      <p class="modal-message">{{ message }}</p>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" (click)="onClose()">Maybe Later</button>
        <button type="button" class="btn-upgrade" (click)="onUpgrade()">Upgrade to Pro →</button>
      </div>
    </div>
  </div>
}
