@if (compact) {
  <!-- Compact mode: dropdown -->
  <div
    class="card compact"
    [class.unread]="!notification.read"
    (click)="onClick()">
    <span class="dot" [class.dot-unread]="!notification.read"></span>
    <div class="card-body">
      <div class="card-title" [class.bold]="!notification.read">{{ notification.title }}</div>
      <div class="card-message">{{ truncatedMessage }}</div>
    </div>
    <span class="card-time">{{ timeAgo(notification.createdAt) }}</span>
  </div>
} @else {
  <!-- Full page mode -->
  <div
    class="card full"
    [class.unread]="!notification.read"
    (click)="onClick()">
    <div class="card-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17 5.8 21.3l2.4-7.4L2 9.4h7.6L12 2z"/>
      </svg>
    </div>
    <div class="card-content">
      <div class="card-title" [class.bold]="!notification.read">{{ notification.title }}</div>
      <div class="card-message full-message">{{ notification.message }}</div>
      <div class="card-date">{{ timeAgo(notification.createdAt) }}</div>
    </div>
    <div class="card-actions">
      @if (!notification.read) {
        <span class="unread-dot"></span>
      }
      @if (!notification.read) {
        <button class="mark-read-btn" (click)="onMarkRead($event)">Mark as read</button>
      }
    </div>
  </div>
}
