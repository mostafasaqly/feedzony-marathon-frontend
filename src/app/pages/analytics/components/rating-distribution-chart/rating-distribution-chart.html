@if (loading) {
  <div class="chart-skeleton">
    <div class="skel-bar" style="width:40%"></div>
    <div class="skel-bar" style="width:20%"></div>
    <div class="skel-bar" style="width:70%"></div>
    <div class="skel-bar" style="width:90%"></div>
    <div class="skel-bar" style="width:55%"></div>
  </div>
} @else if (isEmpty) {
  <div class="empty-state">No ratings yet</div>
} @else {
  <div class="chart-wrap">
    <canvas baseChart
      [data]="chartData"
      [options]="chartOptions"
      type="bar">
    </canvas>
  </div>
}
